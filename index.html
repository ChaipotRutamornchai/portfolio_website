  <!-- Page-specific micro-interactions -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Subtle mouse parallax effect for background glow
      const glows = document.querySelectorAll('.rounded-full.blur-\\[120px\\], .rounded-full.blur-\\[100px\\]');

      window.addEventListener('mousemove', (e) => {
        const { clientX, clientY } = e;
        const moveX = (clientX - window.innerWidth / 2) / 60;
        const moveY = (clientY - window.innerHeight / 2) / 60;

        glows.forEach((glow, index) => {
          const speed = (index + 1) * 0.4;
          glow.style.transform = `translate(${moveX * speed}px, ${moveY * speed}px)`;
        });
      });

      // Entry animation for headline components
      const h1 = document.querySelector('h1');
      const h2 = document.querySelector('h2');
      const buttons = document.querySelectorAll('.nav-btn-hover');

      h1.style.opacity = '0';
      h1.style.transform = 'translateY(30px)';
      h2.style.opacity = '0';
      h2.style.transform = 'translateY(20px)';

      setTimeout(() => {
        h1.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
        h1.style.opacity = '1';
        h1.style.transform = 'translateY(0)';
      }, 300);

      setTimeout(() => {
        h2.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
        h2.style.opacity = '1';
        h2.style.transform = 'translateY(0)';
      }, 600);

      buttons.forEach((btn, i) => {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(15px)';
        setTimeout(() => {
          btn.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        }, 1000 + (i * 120));
      });
    });
  </script>
